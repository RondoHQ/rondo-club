# Include before generic PHP/static regex locations in each Rondo WordPress server.
# Preserve private-file rules previously enforced by Apache .htaccess files.
location = /wp-config.php { deny all; }
location ~ /\.(?!well-known(?:/|$)) { deny all; }
location = /.well-known/apple-app-site-association {
    default_type application/json;
    try_files $uri =404;
}
location ^~ /wp-content/uploads/rondo-communication/ { deny all; }
location ^~ /wp-content/uploads/invoices/ { deny all; }
location ^~ /wp-content/themes/rondo-club/certs/ { deny all; }
location ~* ^/wp-content/uploads/.*(?:\.p12|google-wallet-service-account(?:-[0-9]+)?\.json)$ { deny all; }
location ~* ^/wp-content/novamira-sandbox/.*\.(?:php[0-9]?|phtml|phar)(?:[./]|$) { deny all; }
location ~* ^/wp-content/novamira-sandbox/(?:.*/)?(?:index\.html|[^/]+\.(?:css|js))$ { try_files $uri =404; }
location ~* ^/wp-content/novamira-sandbox/ { deny all; }
location ~* ^/wp-content/(?:uploads|files)/.*\.php(?:$|/) { return 404; }
location ~* \.(?:sql|sqlite|ini|log|bak|conf)$ { deny all; }
