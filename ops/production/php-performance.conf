; Include from /etc/php/8.5/fpm/rondo/prod.conf after the existing pool.
[rondo-prod]
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 3
pm.max_requests = 500
; Keep the existing 1024M per-request and 4 GiB service limits.
; OPcache shared-memory settings must be applied at process startup (-d),
; not as pool php_admin_value settings, which arrive after allocation.
