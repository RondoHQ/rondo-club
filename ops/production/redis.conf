# Dedicated production cache: no TCP listener and no data shared with demo.
port 0
unixsocket /run/rondo-redis-prod/redis.sock
unixsocketperm 660
protected-mode yes
daemonize no
supervised no
logfile ""
loglevel notice
databases 1
maxmemory 512mb
maxmemory-policy allkeys-lru
# WordPress is the source of truth; this cache is disposable.
save ""
appendonly no
