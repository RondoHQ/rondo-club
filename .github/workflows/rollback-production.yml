name: Roll back production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full SHA of an earlier commit on main
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-release:
    name: Rebuild selected commit
    uses: ./.github/workflows/_build-production.yml
    with:
      ref: ${{ inputs.commit_sha }}
    secrets: inherit

  rollback:
    name: Deploy selected release
    needs: build-release
    uses: ./.github/workflows/_deploy-production.yml
    with:
      ref: ${{ needs.build-release.outputs.commit_sha }}
    secrets: inherit
