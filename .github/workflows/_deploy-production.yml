name: Deploy production release

on:
  workflow_call:
    inputs:
      ref:
        description: Full commit SHA from main to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rondo-club-production
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.DEPLOY_PRODUCTION_URL }}
    steps:
      - name: Check out deployment tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: deployer

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rondo-club-${{ github.run_id }}
          path: ${{ runner.temp }}/download

      - name: Prepare release and SSH credentials
        env:
          DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/rondo_deploy_key"
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$RUNNER_TEMP/rondo_deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/rondo_known_hosts"
          mkdir -p "$RUNNER_TEMP/release"
          tar -xzf "$RUNNER_TEMP/download/rondo-club-release.tar.gz" -C "$RUNNER_TEMP/release"

      - name: Deploy and verify
        env:
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          DEPLOY_REMOTE_WP_PATH: ${{ vars.DEPLOY_REMOTE_WP_PATH }}
          DEPLOY_REMOTE_THEME_PATH: ${{ vars.DEPLOY_REMOTE_THEME_PATH }}
          DEPLOY_PRODUCTION_URL: ${{ vars.DEPLOY_PRODUCTION_URL }}
          DEPLOY_SSH_IDENTITY_FILE: ${{ runner.temp }}/rondo_deploy_key
          DEPLOY_SSH_KNOWN_HOSTS_FILE: ${{ runner.temp }}/rondo_known_hosts
          DEPLOY_COMMIT_SHA: ${{ inputs.ref }}
        run: |
          bash deployer/bin/deploy.sh \
            --source-dir "$RUNNER_TEMP/release" \
            --skip-build \
            --prune

      - name: Deployment summary
        env:
          DEPLOYED_SHA: ${{ inputs.ref }}
          DEPLOYED_URL: ${{ vars.DEPLOY_PRODUCTION_URL }}
        run: |
          {
            echo "## Production deployment"
            echo ""
            echo "- Commit: \`$DEPLOYED_SHA\`"
            echo "- URL: $DEPLOYED_URL"
          } >> "$GITHUB_STEP_SUMMARY"
