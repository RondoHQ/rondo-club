name: CI and deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/prd/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-plan:
    name: Plan checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      reuse: ${{ steps.plan.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the reuse decision
        run: python3 tests/python/test_reuse_pr_checks.py
      - name: Find verified identical PR code
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/ci/reuse_pr_checks.py
      - name: Record the exact PR tree being checked
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-tree-${{ github.run_attempt }}-${{ github.event.pull_request.number }}-${{ steps.plan.outputs.tree }}
          path: ${{ runner.temp }}/ci-tested-tree.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  javascript:
    needs: check-plan
    if: needs.check-plan.outputs.reuse != 'true'
    name: JavaScript lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  mobile-spike:
    needs: check-plan
    if: needs.check-plan.outputs.reuse != 'true'
    name: Capacitor spike checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --prefix mobile
      - run: npm test --prefix mobile
      - run: npm run sync --prefix mobile
      - run: npm run prepare:pilot --prefix mobile

  php:
    needs: check-plan
    if: needs.check-plan.outputs.reuse != 'true'
    name: PHP coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction
      - run: composer lint
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Test deployment asset retention and app updates
        run: node --test tests/js/appUpdate.test.mjs tests/js/assetRetention.test.mjs tests/js/deployAssetTransfer.test.mjs

  php-tests:
    needs: check-plan
    if: needs.check-plan.outputs.reuse != 'true'
    name: PHP tests (group ${{ matrix.group }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    services:
      mysql:
        # SQLite is not usable here: the codebase compares meta with
        # 'type' => 'DATETIME', which SQLite cannot evaluate, so the shift
        # calendar silently returns nothing and its tests fail for reasons
        # unrelated to the code.
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rondo
          MYSQL_DATABASE: rondo_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prondo --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      # Keep in step with production; the suite runs the theme against the same
      # WordPress it is deployed on.
      WP_VERSION: 7.1
      WP_ROOT_FOLDER: ${{ github.workspace }}/../wp-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Resolve download paths
        run: echo "WP_TARBALL=$RUNNER_TEMP/wordpress.tar.gz" >> "$GITHUB_ENV"

      - name: Install and test the isolated VOG reader
        run: |
          python3 -m pip install --no-compile --only-binary=:all: --platform manylinux2014_x86_64 --python-version 314 --implementation cp --abi abi3 --require-hashes --target vendor/vog-python -r bin/vog/requirements-linux.txt
          python3 tests/python/test_vog_reader.py
          python3 tests/python/make_vog_fixture.py /tmp/rondo-vog-synthetic.pdf

      - name: Restore the WordPress tarball
        id: wp-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.WP_TARBALL }}
          key: wordpress-${{ env.WP_VERSION }}

      - name: Download WordPress
        if: steps.wp-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$WP_TARBALL")"
          curl -sSLf -o "$WP_TARBALL" "https://wordpress.org/wordpress-${WP_VERSION}.tar.gz"

      - name: Set up WordPress with the theme symlinked in
        run: |
          set -euo pipefail
          mkdir -p "$WP_ROOT_FOLDER"
          WP_ROOT_FOLDER="$(cd "$WP_ROOT_FOLDER" && pwd -P)"
          echo "WP_ROOT_FOLDER=$WP_ROOT_FOLDER" >> "$GITHUB_ENV"
          tar -xzf "$WP_TARBALL" --strip-components=1 -C "$WP_ROOT_FOLDER"
          mkdir -p "$WP_ROOT_FOLDER/wp-content/plugins" "$WP_ROOT_FOLDER/wp-content/themes"
          ln -sfn "$GITHUB_WORKSPACE" "$WP_ROOT_FOLDER/wp-content/themes/rondo-club"
          test -f "$WP_ROOT_FOLDER/wp-content/themes/rondo-club/style.css"

      - name: Write the test environment
        run: |
          cat > tests/.env <<ENV
          WP_ROOT_FOLDER=$WP_ROOT_FOLDER
          TEST_DB_URL=mysql://root:rondo@127.0.0.1:3306/rondo_tests
          WP_DOMAIN=rondo.test
          ENV

      - name: Select a balanced test group
        run: |
          python3 tests/python/test_ci_test_groups.py
          python3 tests/ci/split_php_tests.py --group "${{ matrix.group }}"

      - name: Run the test suite without field plugins
        env:
          # wp-browser caps its theme-activation subprocess at 30 seconds by
          # default. Shared runners can exceed that before tests even start.
          WPBROWSER_LOOP_DEBUG: 1
        run: |
          composer test -- --group ci --override "groups: ci: tests/_output/ci-group.txt" --xml php-tests.xml
          python3 tests/ci/split_php_tests.py --group "${{ matrix.group }}" --verify-report tests/_output/php-tests.xml

      - name: Test the opt-in mobile adapter in a development environment
        if: matrix.group == 1
        env:
          WP_ENVIRONMENT_TYPE: local
          WPBROWSER_LOOP_DEBUG: 1
        run: vendor/bin/codecept run Wpunit MobileSpikeTest --xml mobile-tests.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: php-tests-group-${{ matrix.group }}
          path: |
            tests/_output/php-tests.xml
            tests/_output/mobile-tests.xml
            tests/_output/ci-group.txt
          retention-days: 7

  tests:
    # Keep one stable status and block deployment if any group fails or is skipped.
    name: PHP tests
    needs: [check-plan, php-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all test groups to pass
        env:
          PLAN_RESULT: ${{ needs.check-plan.result }}
          REUSE_CHECKS: ${{ needs.check-plan.outputs.reuse }}
          GROUP_RESULT: ${{ needs.php-tests.result }}
        run: |
          test "$PLAN_RESULT" = success
          if [ "$REUSE_CHECKS" = true ]; then
            test "$GROUP_RESULT" = skipped
          else
            test "$GROUP_RESULT" = success
          fi

  build-release:
    name: Prepare production release
    # Build while checks run; only the deploy job waits for every check.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_build-production.yml
    with:
      ref: ${{ github.sha }}
    secrets: inherit

  deploy:
    name: Deploy successful main commit
    needs:
      - check-plan
      - build-release
      - javascript
      - php
      - tests
      - mobile-spike
    # Skipped checks are allowed only with verified identical PR evidence.
    if: >-
      !cancelled() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      needs.check-plan.result == 'success' &&
      needs.build-release.result == 'success' &&
      needs.tests.result == 'success' &&
      (needs.check-plan.outputs.reuse == 'true' ||
       (needs.javascript.result == 'success' && needs.php.result == 'success' &&
        needs.mobile-spike.result == 'success'))
    uses: ./.github/workflows/_deploy-production.yml
    with:
      ref: ${{ needs.build-release.outputs.commit_sha }}
    secrets: inherit
