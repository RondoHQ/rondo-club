name: CI and deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/prd/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  mobile-spike:
    name: Capacitor spike checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --prefix mobile
      - run: npm test --prefix mobile
      - run: npm run sync --prefix mobile
      - run: npm run prepare:pilot --prefix mobile

  php:
    name: PHP coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction
      - run: composer lint

  tests:
    name: PHP tests
    runs-on: ubuntu-latest
    services:
      mysql:
        # SQLite is not usable here: the codebase compares meta with
        # 'type' => 'DATETIME', which SQLite cannot evaluate, so the shift
        # calendar silently returns nothing and its tests fail for reasons
        # unrelated to the code.
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rondo
          MYSQL_DATABASE: rondo_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prondo --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      # Keep in step with production; the suite runs the theme against the same
      # WordPress it is deployed on.
      WP_VERSION: 7.1
      WP_ROOT_FOLDER: ${{ github.workspace }}/../wp-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Resolve download paths
        run: echo "WP_TARBALL=$RUNNER_TEMP/wordpress.tar.gz" >> "$GITHUB_ENV"

      - name: Restore the WordPress tarball
        id: wp-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.WP_TARBALL }}
          key: wordpress-${{ env.WP_VERSION }}

      - name: Download WordPress
        if: steps.wp-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$WP_TARBALL")"
          curl -sSLf -o "$WP_TARBALL" "https://wordpress.org/wordpress-${WP_VERSION}.tar.gz"

      - name: Set up WordPress with the theme symlinked in
        run: |
          set -euo pipefail
          mkdir -p "$WP_ROOT_FOLDER"
          WP_ROOT_FOLDER="$(cd "$WP_ROOT_FOLDER" && pwd -P)"
          echo "WP_ROOT_FOLDER=$WP_ROOT_FOLDER" >> "$GITHUB_ENV"
          tar -xzf "$WP_TARBALL" --strip-components=1 -C "$WP_ROOT_FOLDER"
          mkdir -p "$WP_ROOT_FOLDER/wp-content/plugins" "$WP_ROOT_FOLDER/wp-content/themes"
          ln -sfn "$GITHUB_WORKSPACE" "$WP_ROOT_FOLDER/wp-content/themes/rondo-club"
          test -f "$WP_ROOT_FOLDER/wp-content/themes/rondo-club/style.css"

      - name: Write the test environment
        run: |
          cat > tests/.env <<ENV
          WP_ROOT_FOLDER=$WP_ROOT_FOLDER
          TEST_DB_URL=mysql://root:rondo@127.0.0.1:3306/rondo_tests
          WP_DOMAIN=rondo.test
          ENV

      - name: Run the test suite without field plugins
        env:
          # wp-browser caps its theme-activation subprocess at 30 seconds by
          # default. Shared runners can exceed that before tests even start.
          WPBROWSER_LOOP_DEBUG: 1
        run: composer test

      - name: Test the opt-in mobile adapter in a development environment
        env:
          WP_ENVIRONMENT_TYPE: local
          WPBROWSER_LOOP_DEBUG: 1
        run: vendor/bin/codecept run Wpunit MobileSpikeTest

  deploy:
    name: Deploy successful main commit
    needs:
      - javascript
      - php
      - tests
      - mobile-spike
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_deploy-production.yml
    with:
      ref: ${{ github.sha }}
    secrets: inherit
