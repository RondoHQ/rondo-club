name: CI and deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  php:
    name: PHP coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction
      - run: composer lint

  tests:
    name: PHP tests
    runs-on: ubuntu-latest
    services:
      mysql:
        # SQLite is not usable here: the codebase compares meta with
        # 'type' => 'DATETIME', which SQLite cannot evaluate, so the shift
        # calendar silently returns nothing and its tests fail for reasons
        # unrelated to the code.
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rondo
          MYSQL_DATABASE: rondo_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prondo --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      # Keep in step with production; the suite runs the theme against the same
      # WordPress it is deployed on.
      WP_VERSION: 7.0.2
      # Likewise pinned to production (wp plugin get advanced-custom-fields-pro).
      # Pinning also makes the download cacheable and stops a silent ACF release
      # from changing what the suite ran against between two identical commits.
      ACF_VERSION: 6.8.6
      WP_ROOT_FOLDER: ${{ github.workspace }}/../wp-test
      # Version lives in the cache key, not the filename — GitHub does not allow
      # one env entry to reference another, and duplicating it here would rot.
      # These sit under github.workspace rather than runner.temp: the runner
      # context is not available to a job-level env block, only inside steps.
      WP_TARBALL: ${{ github.workspace }}/../downloads/wordpress.tar.gz
      ACF_ZIP: ${{ github.workspace }}/../downloads/acf-pro.zip
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Check for an ACF Pro license
        id: acf
        env:
          ACF_PRO_LICENSE_KEY: ${{ secrets.ACF_PRO_LICENSE_KEY }}
        run: |
          if [ -z "$ACF_PRO_LICENSE_KEY" ]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::warning title=PHP tests skipped::ACF_PRO_LICENSE_KEY is not set, so the theme cannot be booted and the test suite did not run. Add the repository secret to enable it.'
          else
            echo 'available=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Restore the WordPress tarball
        id: wp-cache
        if: steps.acf.outputs.available == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.WP_TARBALL }}
          key: wordpress-${{ env.WP_VERSION }}

      - name: Download WordPress
        if: steps.acf.outputs.available == 'true' && steps.wp-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$WP_TARBALL")"
          curl -sSLf -o "$WP_TARBALL" "https://wordpress.org/wordpress-${WP_VERSION}.tar.gz"

      - name: Restore the ACF Pro zip
        id: acf-cache
        if: steps.acf.outputs.available == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.ACF_ZIP }}
          key: acf-pro-${{ env.ACF_VERSION }}

      - name: Download ACF Pro
        if: steps.acf.outputs.available == 'true' && steps.acf-cache.outputs.cache-hit != 'true'
        env:
          ACF_PRO_LICENSE_KEY: ${{ secrets.ACF_PRO_LICENSE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$ACF_ZIP")"
          # ACF Pro is a paid plugin and cannot live in the repository. Fetch the
          # licensed build the club already pays for, at the pinned version.
          curl -sSLf -o "$ACF_ZIP" \
            "https://connect.advancedcustomfields.com/index.php?p=pro&a=download&k=${ACF_PRO_LICENSE_KEY}&t=${ACF_VERSION}"

      - name: Set up WordPress with the theme symlinked in
        if: steps.acf.outputs.available == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$WP_ROOT_FOLDER"
          tar -xzf "$WP_TARBALL" --strip-components=1 -C "$WP_ROOT_FOLDER"

          mkdir -p "$WP_ROOT_FOLDER/wp-content/plugins" "$WP_ROOT_FOLDER/wp-content/themes"

          unzip -q "$ACF_ZIP" -d "$WP_ROOT_FOLDER/wp-content/plugins"
          acf_php="$WP_ROOT_FOLDER/wp-content/plugins/advanced-custom-fields-pro/acf.php"
          test -f "$acf_php"

          # A cached zip is only as good as its key. If ACF ever ignores the
          # pinned t= parameter, or a cache entry outlives a version bump, the
          # suite would quietly run against a different ACF than production —
          # so check rather than assume.
          installed=$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*//p' "$acf_php" | head -1)
          if [ "$installed" != "$ACF_VERSION" ]; then
            echo "::error title=ACF version mismatch::Expected ACF Pro ${ACF_VERSION} but got ${installed}. Bump ACF_VERSION in this workflow to match production."
            exit 1
          fi
          echo "ACF Pro ${installed} ready."

          # The suite runs the checkout itself, not a copy of it.
          ln -sfn "$GITHUB_WORKSPACE" "$WP_ROOT_FOLDER/wp-content/themes/rondo-club"

      - name: Write the test environment
        if: steps.acf.outputs.available == 'true'
        run: |
          set -euo pipefail
          cat > tests/.env <<ENV
          WP_ROOT_FOLDER=$WP_ROOT_FOLDER
          TEST_DB_URL=mysql://root:rondo@127.0.0.1:3306/rondo_tests
          WP_DOMAIN=rondo.test
          ENV

      - name: Run the test suite
        if: steps.acf.outputs.available == 'true'
        run: composer test

  deploy:
    name: Deploy successful main commit
    needs:
      - javascript
      - php
      - tests
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_deploy-production.yml
    with:
      ref: ${{ github.sha }}
    secrets: inherit
