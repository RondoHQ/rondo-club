name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  javascript:
    name: JavaScript lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  php:
    name: PHP coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: ramsey/composer-install@a35c6ebd3d08125aaf8852dff361e686a1a67947 # v3 + Node 24 fix
        with:
          composer-options: --prefer-dist
      - run: composer lint
